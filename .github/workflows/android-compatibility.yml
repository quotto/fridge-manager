name: Android compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1"

permissions:
  contents: read

concurrency:
  group: android-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation:
    name: Android API ${{ matrix.api-level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # Android 11〜17に加え、要件で明示されたAndroid 12Lも検証する。
        # Preview SDK is the most availability-sensitive, so validate it first.
        api-level: [37, 30, 31, 32, 33, 34, 35, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true

      - name: Build instrumentation APKs before starting emulator
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Grant this runner access to KVM
        run: sudo setfacl -m "u:${USER}:rw" /dev/kvm

      - name: Run instrumentation suite
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          # Android 17 preview packages use the repository identifier android-37.0.
          api-level: ${{ matrix.api-level == 37 && '37.0' || matrix.api-level }}
          # API 37 is a preview SDK and is not published on the stable SDK channel yet.
          channel: ${{ matrix.api-level == 37 && 'canary' || 'stable' }}
          # The Android 17 preview runtime is published as a bootable 16 KB page-size image.
          target: ${{ matrix.api-level == 37 && 'google_apis_ps16k' || 'google_apis' }}
          arch: x86_64
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash .github/scripts/wait-for-android-package-service.sh
            ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1g connectedDebugAndroidTest

      - name: Build privacy-safe test evidence
        if: always()
        run: node .github/scripts/sanitize-android-test-results.mjs

      - name: Upload API-specific test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-compatibility-${{ matrix.api-level }}
          path: .compatibility-evidence/summary.json
          if-no-files-found: error
          retention-days: 7
