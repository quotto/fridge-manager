name: Bootstrap Cloudflare API Origin

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target environment
        required: true
        type: choice
        options: [stg, prod]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudflare-api-bootstrap-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Deploy truststore and API Gateway custom domain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.target == 'prod' && 'production' || 'staging' }}
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ap-northeast-1
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_PROJECT_NUMBER: ${{ vars.FIREBASE_PROJECT_NUMBER }}
      FIREBASE_APP_IDS: ${{ vars.FIREBASE_APP_IDS }}
      GOOGLE_WIF_AUDIENCE: ${{ vars.GOOGLE_WIF_AUDIENCE }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ vars.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      OPERATIONS_NOTIFICATION_EMAIL: ${{ secrets.OPERATIONS_NOTIFICATION_EMAIL }}
      ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_AOP_TOKEN: ${{ secrets.CLOUDFLARE_AOP_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22", cache: npm }
      - run: npm ci --ignore-scripts
      - run: npx cdk synth -o cdk.out
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Deploy AOP truststore bucket
        env:
          FOUNDATION_STACK: ${{ inputs.target == 'prod' && 'FridgeManagerProdFoundation' || 'FridgeManagerStgFoundation' }}
        run: npx cdk deploy "$FOUNDATION_STACK" --app cdk.out --exclusively --rollback --require-approval never
      - name: Generate and upload AOP certificate
        env:
          TARGET: ${{ inputs.target }}
        run: bash .github/scripts/provision-cloudflare-aop.sh
      - name: Deploy API Gateway custom domain with mTLS
        env:
          AOP_TRUSTSTORE_PHASE: pending
        run: bash .github/scripts/deploy-cloud.sh "${{ inputs.target }}" cdk.out
      - name: Activate hostname AOP after mTLS deployment
        env:
          TARGET: ${{ inputs.target }}
        run: bash .github/scripts/activate-cloudflare-aop.sh
      - name: Configure proxied Cloudflare DNS and rate limiting
        env:
          TARGET: ${{ inputs.target }}
        run: bash .github/scripts/configure-cloudflare-api.sh
      - name: Smoke test the Cloudflare-proxied API
        run: bash .github/scripts/smoke-cloud.sh "${{ inputs.target }}"
